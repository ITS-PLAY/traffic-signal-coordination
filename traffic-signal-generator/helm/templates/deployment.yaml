apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | default .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.name | default .Release.Name }}
      app.kubernetes.io/name: {{ .Values.name | default .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Values.name | default .Release.Name }}
        app.kubernetes.io/name: {{ .Values.name | default .Release.Name }}
        app: {{ .Values.name | default .Release.Name }}
    spec:
      containers:
      - name: nginx
        image: {{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}
        volumeMounts:
        - name: nginx-config
          subPath: nginx.conf
          mountPath: /etc/nginx/nginx.conf
          readOnly: true
        - name: nginx-public
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: data
          mountPath: /run/data
        ports:
        - containerPort: 80
      - name: api
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        env:
          - name: PORT
            value: "3001"
          - name: LISTEN
            value: "0.0.0.0"
        livenessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 60
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /run/data
        - name: nginx-public
          mountPath: /usr/share/nginx/html
        - name: config
          mountPath: /app/config
      volumes:
      - name: data
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: {{print ( .Values.name | default .Release.Name ) "-nginx-config"}}
      - name: nginx-public
        emptyDir: {}
      - name: config
        secret:
          secretName: {{ .Values.name | default .Release.Name }}-config
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
