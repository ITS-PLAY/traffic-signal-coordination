<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>示意图开发预览</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f1f5f9; margin: 0; padding: 16px; }
  .cell { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: inline-block; }
  .cell h3 { margin: 0 0 8px; font-size: 14px; }
  svg { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
</style>
</head>
<body>
<div class="cell"><h3 id="cap"></h3><svg id="sk" style="width:640px"></svg></div>
<script src="codec.js"></script>
<script src="sketch.js"></script>
<script>
const INPUT = {"crossList":["C1","C2","C3"],"roadLength":[117,558],"crossInfo":{"C1":"1,221,4|4,0,1|3,422,2;A1636|B47","C2":"1,4223,2|4,441,1|3,4223,2;A1232|B1434|C45","C3":"1,822,2|3,822,2;A1232|B3818|C2040"},"planInfo":{"C1":"A43B27,A0","C2":"A21B32C17,A0","C3":"A37B15C18,A-35"},"roadSpeed":[[52,66],[57,63]],"crossFlow":{"C1":{"11":88,"12":220,"18":44,"32":232,"34":28,"38":20,"41":24,"44":100,"48":60},"C2":{"11":108,"12":144,"18":20,"32":92,"34":56,"38":12,"41":40,"42":12,"44":204,"48":20},"C3":{"12":172,"18":12,"32":120,"38":72}},"config":{"outbound":true,"inbound":true,"onlyEvaluation":false,"mode":"best"}};
const state = TsCodec.inputToState(INPUT);
const which = new URLSearchParams(location.search).get('only') || '1';
const cross = state.crosses[new URLSearchParams(location.search).get('cross') || 'C2'];
const cap = { '1': '1 渠化图', '2': '2 相位图', '3': '3 流量图' }[which];
document.getElementById('cap').textContent = cap + '（' + (new URLSearchParams(location.search).get('cross') || 'C2') + '）';
const svg = document.getElementById('sk');
if (which === '1') TsSketch.drawChannel(svg, cross);
if (which === '2') TsSketch.drawPhase(svg, cross, null);
if (which === '3') TsSketch.drawFlow(svg, cross);
</script>
</body>
</html>
